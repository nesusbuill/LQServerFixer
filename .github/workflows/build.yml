name: Build LQ Server Fixer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Chấp nhận giấy phép Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Tạo Keystore tự động
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias lqserver -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LQ Server, OU=Dev, O=Apex, L=Hanoi, S=Hanoi, C=VN"

      - name: Build APK Release
        run: gradle assembleRelease

      - name: Upload APK lên Github (QUAN TRỌNG NHẤT)
        uses: actions/upload-artifact@v4
        with:
          name: LQ-Server-Fixer-APK
          path: app/build/outputs/apk/release/app-release.apk
