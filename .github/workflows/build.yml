name: Build LQServerFixer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias lqserver \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lqserver123 \
            -keypass lqserver123 \
            -dname "CN=LQServerFixer, OU=Dev, O=Apex, L=Hanoi, S=Hanoi, C=VN"

      - name: Build Release APK
        # Đã đổi từ ./gradlew thành gradle để không cần file gradlew
        run: gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LQServerFixer_v1.0.0
          path: app/build/outputs/apk/release/LQServerFixer_v1.0.0.apk
          if-no-files-found: error
